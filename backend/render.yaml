services:
  - type: web
    name: growthcortex-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://startup-growth-copilot.vercel.app,http://localhost:3000,http://127.0.0.1:3000
      - key: PYTHON_VERSION
        value: 3.12.0
